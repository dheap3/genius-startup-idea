    <link rel="stylesheet" href="styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <header>

        <img src="images\Candy-Land-Logo.png" alt="Candy Land Logo" />

        <div class="row">
          <span class="name">Alice</span><progress value="70" max="100"></progress><span class="percent">70%</span>

          <span class="name">Jerry</span><progress value="30" max="100"></progress><span class="percent">30%</span>
        </div>

          <span class="name">Uncle Mike</span><progress value="55" max="100"></progress><span class="percent">55%</span>
        </div>
        <div class="row">
          <span class="name">Susan</span><progress value="88" max="100"></progress><span class="percent">88%</span>
        </div>

    <hr />
    <footer>
