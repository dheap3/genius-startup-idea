<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Candy Land</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="play.css" />
    </head>
    <body>
        <header>
            <h1>
                <img src="images\Candy-Land-Logo.png" alt="Candy Land Logo" />
            </h1>
            <menu>
                <li><a href="index.html">Home</a></li>
                <li><a href="play.html">Play</a></li>
                <li><a href="progress.html">Progress</a></li>
                <li><a href="about.html">About</a></li>
            </menu>
        </header>
        <hr />
        <main>
            <div class="player-info">
                <span>Player: </span>
                <span>Uncle Mike</span>
            </div>
            <div id="play-area">
                <img
                    id="gameboard"
                    src="images\Classic-Board-2004.png"
                    alt="Candy Land Board"
                />
                <div id="card-area">
                    <div class="deck">
                        Card Deck
                        <img
                            class="card"
                            src="images\cards\Card Back.png"
                            alt="Back of Card Deck"
                        />
                    </div>
                    <div class="deck">
                        <img
                            class="card"
                            src="images\cards\Purple2.png"
                            alt="Purple 2 Card"
                        />
                        Current Card
                    </div>
                </div>
            </div>
        </main>
        <hr />
        <footer>
            <div>David Heap</div>
            <a href="https://github.com/dheap3/genius-startup-idea"
                >GitHub Repository</a
            >
        </footer>
    </body>
</html>
